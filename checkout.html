<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | VaporSaint.clo</title>
  <link rel="stylesheet" href="css/styles.css?v=12">
  <style>
    /* ── Checkout page ── */
    .checkout-page { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .checkout-page .page-intro { padding: 0 0 32px; }
    .checkout-page .page-intro h1 { font-size: 48px; color: #fff; margin: 6px 0 0; }

    .checkout-wrap {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
      align-items: start;
    }

    /* Form card */
    .checkout-form-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 32px;
    }
    .checkout-form-card h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--lime); margin: 0 0 20px;
    }
    .checkout-form-card h2 + h2 { margin-top: 32px; }
    .form-section { margin-bottom: 32px; }
    .form-section:last-of-type { margin-bottom: 0; }

    /* Input grid */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .input-grid .full { grid-column: 1 / -1; }

    .field-label {
      display: flex; flex-direction: column; gap: 7px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: #666;
    }
    .field-label input, .field-label select {
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .2s;
    }
    .field-label input:focus, .field-label select:focus {
      outline: none;
      border-color: var(--lime);
    }

    /* Payment options */
    .payment-options { display: flex; gap: 12px; flex-wrap: wrap; }
    .pay-opt {
      flex: 1; min-width: 110px;
      display: flex; align-items: center; gap: 10px;
      background: #1a1a1a; border: 1px solid #2e2e2e;
      border-radius: 8px; padding: 14px 16px;
      cursor: pointer; transition: border-color .2s;
      font-size: 13px; color: #ccc;
      position: relative;
    }
    .pay-opt input[type="radio"] { accent-color: var(--lime); width: 16px; height: 16px; }
    .pay-opt:has(input:checked) {
      border-color: var(--lime);
      background: #131f00;
    }
    .pay-opt-icon { font-size: 20px; }

    /* Form message */
    .form-msg {
      margin: 16px 0 0;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .form-msg.error { background: #2a0000; border: 1px solid #c33; color: #ff9999; display: block; }
    .form-msg.success { background: #182800; border: 1px solid var(--lime); color: #c8ff00; display: block; }

    /* Place order button */
    .place-order-btn {
      display: block; width: 100%; margin-top: 24px;
      padding: 16px; text-align: center;
      background: var(--lime); color: #111;
      font-weight: 900; font-size: 14px;
      text-transform: uppercase; letter-spacing: .1em;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background .2s;
    }
    .place-order-btn:hover { background: #c8ff00; }
    .place-order-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* Summary sidebar */
    .checkout-summary-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 28px 24px;
      position: sticky;
      top: 90px;
    }
    .checkout-summary-card h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--lime); margin: 0 0 18px;
    }

    /* Mini order lines */
    .summary-items { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .summary-line {
      display: flex; align-items: center; gap: 12px;
    }
    .summary-thumb {
      width: 48px; height: 48px; background: #f5f5f5;
      border-radius: 5px; overflow: hidden; flex-shrink: 0;
    }
    .summary-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .summary-line-info { flex: 1; }
    .summary-line-name { font-size: 13px; color: #fff; font-weight: 600; }
    .summary-line-qty  { font-size: 11px; color: #555; }
    .summary-line-price { font-size: 13px; color: #ccc; font-weight: 600; white-space: nowrap; }

    .sum-divider { border: none; border-top: 1px solid #1e1e1e; margin: 16px 0; }

    .sum-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; font-size: 14px; color: #888;
    }
    .sum-row b { color: #fff; }
    .sum-row.total {
      font-size: 17px; font-weight: 700; color: #fff;
      padding-top: 14px; border-top: 1px solid #333; margin-top: 6px;
    }
    .sum-row.total b { color: var(--lime); font-size: 20px; }

    .secure-note {
      display: flex; align-items: center; gap: 8px;
      margin-top: 20px; font-size: 11px; color: #444;
      text-transform: uppercase; letter-spacing: .07em;
    }

    /* Mobile */
    @media(max-width: 700px) {
      .checkout-wrap { grid-template-columns: 1fr; }
      .checkout-page .page-intro h1 { font-size: 34px; }
      .input-grid { grid-template-columns: 1fr; }
      .input-grid .full { grid-column: 1; }
      .checkout-summary-card { position: static; }
      .payment-options { gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">VAPOR<span>SAINT</span>.CLO</a>
    <button class="menu-btn" aria-label="Open navigation">☰</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="products.html#builder">Outfit Builder</a>
      <a href="account.php">Account</a>
      <a href="cart.html">Cart <b class="cart-count">0</b></a>
    </nav>
  </header>

  <main>
    <div class="checkout-page">
      <div class="page-intro">
        <p class="eyebrow">SECURE CHECKOUT</p>
        <h1>Complete your order.</h1>
      </div>

      <div class="checkout-wrap">
        <!-- LEFT: Form -->
        <div class="checkout-form-card">
          <form id="checkout-form" novalidate>

            <div class="form-section">
              <h2>Customer Information</h2>
              <div class="input-grid">
                <label class="field-label">
                  Full Name
                  <input name="name" type="text" placeholder="Juan Dela Cruz" required>
                </label>
                <label class="field-label">
                  Email Address
                  <input name="email" type="email" placeholder="juan@example.com" required>
                </label>
                <label class="field-label full">
                  Delivery Address
                  <input name="address" type="text" placeholder="Street, Barangay, City, Province" required>
                </label>
                <label class="field-label">
                  Phone Number
                  <input name="phone" type="tel" placeholder="+63 912 345 6789" required>
                </label>
              </div>
            </div>

            <div class="form-section">
              <h2>Payment Method</h2>
              <div class="payment-options">
                <label class="pay-opt">
                  <input type="radio" name="payment" value="GCash" required>
                  <span class="pay-opt-icon">📱</span> GCash
                </label>
                <label class="pay-opt">
                  <input type="radio" name="payment" value="Card">
                  <span class="pay-opt-icon">💳</span> Card
                </label>
                <label class="pay-opt">
                  <input type="radio" name="payment" value="COD">
                  <span class="pay-opt-icon">🏠</span> Cash on Delivery
                </label>
              </div>
            </div>

            <div id="form-msg" class="form-msg"></div>
            <button class="place-order-btn" type="submit">Place Order →</button>
          </form>
        </div>

        <!-- RIGHT: Summary -->
        <aside class="checkout-summary-card">
          <h2>Order Summary</h2>
          <div class="summary-items" id="summary-items"></div>
          <hr class="sum-divider">
          <div class="sum-row"><span>Subtotal</span><b id="sum-subtotal">—</b></div>
          <div class="sum-row"><span>Delivery</span><b id="sum-delivery">—</b></div>
          <div class="sum-row total"><span>Total</span><b id="sum-total">—</b></div>
          <div class="secure-note">🔒 Demo checkout — no real payment</div>
        </aside>
      </div>
    </div>
  </main>

  <footer>VAPORSAINT.CLO <span>Encrypted demo checkout</span></footer>

  <script src="js/app.js"></script>
  <script>renderCheckout();</script>
</body>
</html>
