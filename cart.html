<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | VaporSaint.clo</title>
  <link rel="stylesheet" href="css/styles.css?v=12">
  <style>
    /* ── Cart page ── */
    .cart-page { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .cart-page .page-intro { padding: 0 0 32px; }
    .cart-page .page-intro h1 { font-size: 48px; color: #fff; margin: 6px 0 0; }

    /* Layout: items left, summary right */
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
      align-items: start;
    }

    /* Cart items list */
    .cart-items-col { display: flex; flex-direction: column; gap: 14px; }

    /* Single cart row */
    .cart-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 18px;
      align-items: center;
      background: #151515;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px 20px;
    }

    /* Product thumbnail */
    .cart-thumb {
      width: 90px; height: 90px;
      background: #f5f5f5;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cart-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* Product info */
    .cart-info { display: flex; flex-direction: column; gap: 4px; }
    .cart-info .item-name { font-size: 15px; font-weight: 700; color: #fff; }
    .cart-info .item-cat  { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .07em; }
    .cart-info .item-price { font-size: 13px; color: var(--lime); font-weight: 600; margin-top: 4px; }

    /* Qty + remove controls */
    .cart-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .qty-ctrl { display: flex; align-items: center; gap: 0; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
    .qty-ctrl button {
      background: #1e1e1e; border: none; color: #ccc;
      width: 34px; height: 34px; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .qty-ctrl button:hover { background: #2a2a2a; color: #fff; }
    .qty-ctrl span { width: 36px; text-align: center; font-size: 14px; color: #fff; font-weight: 600; }
    .item-line-total { font-size: 15px; font-weight: 700; color: #fff; }
    .remove-btn {
      background: none; border: none; color: #555; font-size: 11px;
      text-transform: uppercase; letter-spacing: .07em; cursor: pointer;
      padding: 0;
    }
    .remove-btn:hover { color: #c33; }

    /* Empty state */
    .cart-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: #151515;
      border: 1px solid #222;
      border-radius: 12px;
    }
    .cart-empty .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .cart-empty h2 { font-size: 26px; color: #fff; margin: 0 0 10px; }
    .cart-empty p { color: #666; margin: 0 0 28px; }

    /* Summary sidebar */
    .cart-summary {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 28px 24px;
      position: sticky;
      top: 90px;
    }
    .cart-summary h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .1em; color: #fff; margin: 0 0 20px; }
    .sum-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #1e1e1e;
      font-size: 14px; color: #888;
    }
    .sum-row:last-of-type { border-bottom: none; }
    .sum-row b { color: #fff; }
    .sum-row.total { font-size: 17px; font-weight: 700; color: #fff; padding-top: 16px; border-top: 1px solid #333; margin-top: 4px; }
    .sum-row.total b { color: var(--lime); font-size: 20px; }
    .checkout-btn {
      display: block; width: 100%; margin-top: 20px;
      padding: 15px; text-align: center;
      background: var(--lime); color: #111;
      font-weight: 900; font-size: 13px;
      text-transform: uppercase; letter-spacing: .1em;
      border: none; border-radius: 7px; cursor: pointer;
      text-decoration: none;
    }
    .checkout-btn:hover { background: #c8ff00; }
    .continue-link {
      display: block; text-align: center; margin-top: 14px;
      font-size: 12px; color: #555;
      text-transform: uppercase; letter-spacing: .07em;
    }
    .continue-link:hover { color: var(--lime); }

    /* Mobile */
    @media(max-width: 700px) {
      .cart-layout { grid-template-columns: 1fr; }
      .cart-page .page-intro h1 { font-size: 34px; }
      .cart-row { grid-template-columns: 70px 1fr; gap: 12px; }
      .cart-actions { flex-direction: row; align-items: center; grid-column: 1 / -1; }
      .cart-summary { position: static; }
    }
  </style>
</head>
